# BigQuery Analytics Hub Listing - Example
#
# Connector Configuration (totalschema.yml):
#
#   connectors:
#     mybigquery:
#       type: bigquery
#       defaults:
#         projectId: my-gcp-project  # Used if not specified per-action
#         location: US               # Used if not specified per-action
#
# This example demonstrates sharing a BigQuery dataset through Analytics Hub.

CreateListing:
  # Data exchange where the listing will be created
  dataExchangeId: my_data_exchange

  # Unique identifier for the listing
  listingId: sales_data_listing

  # Display name shown in Analytics Hub
  displayName: Sales Data Listing

  # Description of the dataset being shared
  description: Monthly sales data for analytics and reporting

  # Primary contact email for questions about the dataset
  primaryContact: data-team@example.com

  # Documentation URL for users of the dataset
  documentation: https://docs.example.com/datasets/sales-data

  # Categories for the listing (helps with discovery)
  # Available categories: CATEGORY_OTHERS, CATEGORY_ADVERTISING_AND_MARKETING,
  # CATEGORY_COMMERCE, CATEGORY_CLIMATE_AND_ENVIRONMENT, CATEGORY_DEMOGRAPHICS,
  # CATEGORY_ECONOMICS, CATEGORY_EDUCATION, CATEGORY_ENERGY, CATEGORY_FINANCIAL,
  # CATEGORY_GAMING, CATEGORY_GEOSPATIAL, CATEGORY_HEALTHCARE_AND_LIFE_SCIENCE,
  # CATEGORY_MEDIA, CATEGORY_PUBLIC_SECTOR, CATEGORY_RETAIL, CATEGORY_SPORTS,
  # CATEGORY_SCIENCE_AND_RESEARCH, CATEGORY_TRANSPORTATION_AND_LOGISTICS,
  # CATEGORY_TRAVEL_AND_TOURISM
  categories:
    - CATEGORY_RETAIL
    - CATEGORY_ECONOMICS

  # Source dataset to be shared
  sourceDataset:
    # Dataset ID to share (project defaults to connector's projectId)
    dataset: sales_dataset

