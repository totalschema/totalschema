# Example 6: Monthly User Retention
# Calculates monthly retention metrics on the first of each month
CreateScheduledQuery:
  displayName: Monthly User Retention
  query: |
    WITH monthly_active AS (
      SELECT
        user_id,
        DATE_TRUNC(DATE(event_timestamp), MONTH) as month
      FROM `my-project.analytics.events`
      WHERE event_timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 13 MONTH)
      GROUP BY user_id, month
    ),
    retention AS (
      SELECT
        a.month as cohort_month,
        b.month as active_month,
        DATE_DIFF(b.month, a.month, MONTH) as months_since_first,
        COUNT(DISTINCT a.user_id) as cohort_size,
        COUNT(DISTINCT b.user_id) as retained_users
      FROM monthly_active a
      LEFT JOIN monthly_active b ON a.user_id = b.user_id AND b.month >= a.month
      WHERE a.month = (SELECT MIN(month) FROM monthly_active WHERE user_id = a.user_id)
      GROUP BY cohort_month, active_month, months_since_first
    )
    SELECT
      cohort_month,
      months_since_first,
      cohort_size,
      retained_users,
      SAFE_DIVIDE(retained_users, cohort_size) * 100 as retention_rate
    FROM retention
    ORDER BY cohort_month, months_since_first
  destination:
    datasetId: analytics
    tableId: user_retention_monthly
    partitioningField: cohort_month
  schedule: "1 of month 00:00"

---

# Example 7: Parameterized Query with Custom Parameters
# Uses custom parameters for flexible filtering
CreateScheduledQuery:
  displayName: Regional Sales Report
  query: |
    SELECT
      region,
      product_category,
      SUM(amount) as total_sales,
      COUNT(*) as order_count
    FROM `my-project.sales.orders`
    WHERE region = @region
      AND DATE(order_date) >= DATE_SUB(CURRENT_DATE(), INTERVAL @days_back DAY)
    GROUP BY region, product_category
    ORDER BY total_sales DESC
  destination:
    datasetId: regional_analytics
    tableId: regional_sales_report
  schedule: "every day 08:00"
  parameters:
    region: "US-WEST"
    days_back: "30"

---

# Example 8: Multi-Region Setup (Europe)
# Scheduled query for European data with EU location
CreateScheduledQuery:
  displayName: EU Daily Summary
  query: |
    SELECT
      DATE(order_date) as date,
      country,
      SUM(amount_eur) as total_revenue_eur,
      COUNT(*) as order_count
    FROM `my-project.sales_eu.orders`
    WHERE DATE(order_date) = CURRENT_DATE()
      AND country IN ('DE', 'FR', 'UK', 'ES', 'IT')
    GROUP BY date, country
  destination:
    datasetId: eu_analytics
    tableId: eu_daily_summary
    partitioningField: date
  schedule: "every day 00:00"
  disabled: false

---

# Example 9: Replace Existing Query
# Using replaceIfExists to update/replace a previously scheduled query with the same name
CreateScheduledQuery:
  displayName: Updated Customer Metrics
  query: |
    SELECT
      DATE(created_at) as signup_date,
      country,
      COUNT(DISTINCT customer_id) as new_customers,
      SUM(lifetime_value) as total_ltv,
      AVG(lifetime_value) as avg_ltv
    FROM `my-project.sales.customers`
    WHERE DATE(created_at) = CURRENT_DATE()
    GROUP BY signup_date, country
  destination:
    datasetId: analytics
    tableId: customer_metrics_daily
  schedule: "every day 01:00"
  replaceIfExists: true  # Replaces any existing scheduled query with this display name
