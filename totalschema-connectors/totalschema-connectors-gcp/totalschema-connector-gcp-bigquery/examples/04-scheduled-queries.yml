# BigQuery Scheduled Queries - Examples
#
# Connector Configuration (totalschema.yml):
#
#   connectors:
#     mybigquery:
#       type: bigquery
#       defaults:
#         projectId: my-gcp-project  # Used if not specified per-action
#         location: US               # Used if not specified per-action
#
# With connector defaults configured, you can omit projectId and location.
# Override per-action when needed (e.g., for EU queries).

# Example 1: Daily Sales Report
# Runs daily at midnight UTC - appends results to destination table
CreateScheduledQuery:
  displayName: Daily Sales Report
  query: |
    SELECT 
      DATE(order_date) as sales_date,
      COUNT(DISTINCT customer_id) as unique_customers,
      COUNT(*) as total_orders,
      SUM(amount) as total_revenue,
      AVG(amount) as average_order_value
    FROM `my-project.sales.orders`
    WHERE DATE(order_date) = CURRENT_DATE()
    GROUP BY sales_date
  destination:
    datasetId: analytics
    tableId: daily_sales_report
    writeDisposition: WRITE_APPEND  # Default behavior - appends to table
  schedule: "every day 00:00"
  disabled: false

---

# Example 2: Hourly Active Users
# Tracks active users every hour for real-time monitoring
CreateScheduledQuery:
  displayName: Hourly Active Users
  query: |
    SELECT
      TIMESTAMP_TRUNC(event_timestamp, HOUR) as hour,
      COUNT(DISTINCT user_id) as active_users,
      COUNT(*) as total_events
    FROM `my-project.analytics.events`
    WHERE event_timestamp >= TIMESTAMP_SUB(CURRENT_TIMESTAMP(), INTERVAL 1 HOUR)
      AND event_timestamp < CURRENT_TIMESTAMP()
    GROUP BY hour
  destination:
    datasetId: realtime_metrics
    tableId: hourly_active_users
  schedule: "every 1 hours"

---

# Example 3: Weekly Customer Cohort Analysis
# Runs every Monday to analyze customer cohorts from the previous week
# Truncates before each run to maintain current cohort analysis
CreateScheduledQuery:
  displayName: Weekly Customer Cohort Analysis
  query: |
    WITH cohorts AS (
      SELECT
        customer_id,
        MIN(DATE(order_date)) as cohort_date,
        DATE_DIFF(DATE(order_date), MIN(DATE(order_date)) OVER (PARTITION BY customer_id), WEEK) as weeks_since_first_order
      FROM `my-project.sales.orders`
      WHERE DATE(order_date) >= DATE_SUB(CURRENT_DATE(), INTERVAL 8 WEEK)
      GROUP BY customer_id, order_date
    )
    SELECT
      cohort_date,
      weeks_since_first_order,
      COUNT(DISTINCT customer_id) as customers,
      AVG(weeks_since_first_order) as avg_weeks_active
    FROM cohorts
    GROUP BY cohort_date, weeks_since_first_order
    ORDER BY cohort_date, weeks_since_first_order
  destination:
    datasetId: analytics
    tableId: customer_cohort_analysis
    writeDisposition: WRITE_TRUNCATE  # Replace analysis each week
  schedule: "every monday 09:00"

---

# Example 4: Quarterly Financial Summary (Disabled)
# Pre-configured but disabled - can be enabled manually when needed
# Truncates results each quarter for clean quarterly reports
CreateScheduledQuery:
  displayName: Quarterly Financial Summary
  query: |
    SELECT
      EXTRACT(YEAR FROM order_date) as year,
      EXTRACT(QUARTER FROM order_date) as quarter,
      SUM(amount) as total_revenue,
      COUNT(*) as total_orders,
      COUNT(DISTINCT customer_id) as unique_customers,
      SUM(amount) / COUNT(DISTINCT customer_id) as revenue_per_customer
    FROM `my-project.sales.orders`
    WHERE DATE(order_date) >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 1 QUARTER), QUARTER)
      AND DATE(order_date) < DATE_TRUNC(CURRENT_DATE(), QUARTER)
    GROUP BY year, quarter
  destination:
    datasetId: financial_reports
    tableId: quarterly_summary
    writeDisposition: WRITE_TRUNCATE
  schedule: "first day of quarter 00:00"
  disabled: true

