# Example 5: Data Quality Check (Every 15 Minutes)
# Monitors data quality metrics frequently - appends results for audit trail
CreateScheduledQuery:
  displayName: Data Quality Monitor
  query: |
    SELECT
      CURRENT_TIMESTAMP() as check_time,
      table_name,
      COUNT(*) as row_count,
      COUNTIF(id IS NULL) as null_ids,
      COUNTIF(created_at > CURRENT_TIMESTAMP()) as future_dates,
      COUNTIF(amount < 0) as negative_amounts
    FROM (
      SELECT 'orders' as table_name, id, created_at, amount FROM `my-project.sales.orders`
      UNION ALL
      SELECT 'customers' as table_name, id, created_at, NULL as amount FROM `my-project.sales.customers`
    )
    GROUP BY table_name
  destination:
    datasetId: data_quality
    tableId: quality_checks
    partitioningField: check_time
  schedule: "every 15 minutes"

