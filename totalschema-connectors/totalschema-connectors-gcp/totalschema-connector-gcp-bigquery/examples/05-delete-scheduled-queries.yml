# Example 15: Cost Optimization - Delete Unused Queries
# Remove scheduled queries that are no longer needed to save costs

DeleteScheduledQuery:
  transferConfigId: unused-daily-report

---

DeleteScheduledQuery:
  transferConfigId: deprecated-metrics-query

