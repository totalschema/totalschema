# Example 12: Environment-Specific Deletion
# Different config IDs for different environments

# Delete DEV scheduled query
DeleteScheduledQuery:
  transferConfigId: ${devScheduledQueryId}
  location: ${devRegion}

---

# Delete STAGING scheduled query
DeleteScheduledQuery:
  transferConfigId: ${stagingScheduledQueryId}
  location: ${stagingRegion}

---

# Delete PROD scheduled query (be careful!)
DeleteScheduledQuery:
  transferConfigId: ${prodScheduledQueryId}
  location: ${prodRegion}

---

# Example 13: Delete with Explicit Project Override
# Using full resource name to specify a different project
DeleteScheduledQuery:
  transferConfigName: projects/backup-project/locations/eu/transferConfigs/backup-query-id

---

# Example 14: Multi-Region Cleanup
# Delete scheduled queries from multiple regions

# US Region
DeleteScheduledQuery:
  transferConfigId: us-scheduled-query

---

# EU Region
DeleteScheduledQuery:
